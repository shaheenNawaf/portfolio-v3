# Sveltia CMS config — visual editor at yoursite.com/admin/
# Login: "Sign in with Token" + a GitHub fine-grained PAT (contents: read+write).
# Every save commits straight to `main`, which retriggers your host's rebuild.
backend:
  name: github
  repo: shaheenNawaf/portfolio-v3
  branch: main
  auth_methods: [token, oauth]
  commit_messages:
    create: "cms: add {{collection}} {{slug}}"
    update: "cms: update {{collection}} {{slug}}"
    delete: "cms: remove {{collection}} {{slug}}"
    uploadMedia: "cms: upload {{path}}"
    deleteMedia: "cms: remove {{path}}"

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: projects
    label: Projects & Campaigns
    label_singular: Project
    folder: "src/content/projects"
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{category}})"
    sortable_fields: [title, category, date]
    view_filters:
      - label: Software
        field: category
        pattern: "^software$"
      - label: Marketing
        field: category
        pattern: "^marketing$"
      - label: Systems
        field: category
        pattern: "^systems$"
      - label: Drafts
        field: draft
        pattern: true
    fields:
      - { label: Title, name: title, widget: string }
      - label: Category
        name: category
        widget: select
        options: [software, marketing, systems]
        default: software
      - { label: Date, name: date, widget: string, hint: "e.g. June 2025 - Present" }
      - { label: Role, name: role, widget: string }
      - { label: Accent color, name: color, widget: color, default: "#3b82f6" }
      - { label: Result metric, name: results, widget: string, required: false, hint: "Headline stat on the card, e.g. 67% Staff Reduction" }
      - { label: Tags, name: tags, widget: list, required: false, summary: "{{fields.string}}", field: { label: Tag, name: string, widget: string } }
      - { label: Deliverables, name: deliverables, widget: list, required: false, hint: "Marketing cards show these instead of tags", summary: "{{fields.string}}", field: { label: Item, name: string, widget: string } }
      - label: Media
        name: media
        widget: object
        required: false
        collapsed: true
        fields:
          - { label: Type, name: type, widget: select, options: [image, video], default: image }
          - { label: File, name: url, widget: image, allow_multiple: false, hint: "Upload an image, or paste any URL (Cloudinary video URLs work too)", required: false }
          - { label: Thumbnail, name: thumbnail, widget: image, required: false, hint: "Poster frame for videos" }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        summary: "{{fields.image}}"
        field: { label: Image, name: image, widget: image }
      - { label: Live URL, name: liveUrl, widget: string, required: false }
      - { label: Repo URL, name: repoUrl, widget: string, required: false }
      - { label: Problem, name: problem, widget: text, required: false }
      - { label: Solution, name: solution, widget: text, required: false }
      - { label: Impact, name: impact, widget: text, required: false }
      - { label: Case study link, name: caseStudyHref, widget: string, required: false, hint: "e.g. /software — hidden when it equals the current page" }
      - { label: Draft, name: draft, widget: boolean, default: false, hint: "Drafts are hidden on the live site" }
      - { label: Description, name: body, widget: markdown, hint: "Main card text. Plain paragraphs are fine." }

  - name: experiences
    label: Experience
    label_singular: Role
    folder: "src/content/experiences"
    extension: md
    format: frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} @ {{company}}"
    sortable_fields: [title, company, date]
    view_filters:
      - label: Software
        field: category
        pattern: "^software$"
      - label: Marketing
        field: category
        pattern: "^marketing$"
    fields:
      - { label: Job title, name: title, widget: string }
      - { label: Company, name: company, widget: string }
      - { label: Date, name: date, widget: string, hint: "Include the word Present for current roles" }
      - { label: Location, name: location, widget: string }
      - label: Category
        name: category
        widget: select
        options: [software, marketing, systems]
        default: software
      - { label: Accent color, name: color, widget: color, default: "#3b82f6" }
      - label: Bullet points
        name: details
        widget: list
        summary: "{{fields.text}}"
        field: { label: Point, name: text, widget: text }
      - label: Gallery
        name: gallery
        widget: list
        required: false
        summary: "{{fields.image}}"
        field: { label: Image, name: image, widget: image }
      - { label: Video, name: video, widget: string, required: false, hint: "Embed/file URL, e.g. Facebook plugin URL — leave empty for none" }
      - { label: Tech chips, name: tech, widget: list, required: false, summary: "{{fields.string}}", field: { label: Tech, name: string, widget: string } }
      - { label: Description, name: body, widget: markdown, hint: "One or two sentences shown under the role." }
